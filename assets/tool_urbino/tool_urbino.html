<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* su Urbino Centro Storico</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100vh; 
            font-family: 'Inter', sans-serif; 
            background-color: #3b82f6; 
            overflow: hidden;
        }
        
        .window-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #sidebar { 
            position: absolute;
            left: 0;
            top: 0;
            width: 300px; 
            min-width: 300px;
            max-width: 300px;
            height: 100%;
            padding: 20px; 
            background: rgba(30, 41, 59, 0.8); /* Blu scuro desaturato (#1e293b all'80%) */
            color: white; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.7); 
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-sizing: border-box;
            backdrop-filter: blur(8px); /* Effetto vetro opaco elegante */
            -webkit-backdrop-filter: blur(8px);
        }

        #map { 
            position: absolute;
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background: #3b82f6; 
            z-index: 1;
        }

        h3 { margin-top: 0; color: #ffffff; font-size: 22px; font-weight: 800;} 
        p { line-height: 1.5; color: #94a3b8; font-size: 14px;}
        strong { color: #f8fafc; }
        .btn {
            background: #e5e5e5;
            color: #404040;
            border: 1px solid #404040;
            padding: 10px 24px;
            border-radius: 6px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover {
            background: #d4d4d4;
            color: #262626;
            border: 1px solid #262626;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .info { background: #1e293b; padding: 15px; margin-top: 15px; border-radius: 4px; font-size: 15px; border-left: 4px solid #fbbf24; }
        #dist-val { color: #fbbf24; font-weight: bold; font-size: 18px; }

        .leaflet-tooltip {
            background-color: #111827 !important;
            color: #fbbf24 !important;
            border: 1px solid #fbbf24 !important;
            border-radius: 4px;
            font-weight: bold;
            padding: 6px 10px;
        }

        .blue-map-filter {
            filter: sepia(100%) hue-rotate(190deg) saturate(300%) brightness(120%);
        }
        
        .legenda { margin-top: 15px; }
        .leg-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="window-wrapper">
        <div id="sidebar">
            <div>
                <h3>Centro storico di Urbino</h3>
                <p><strong>Ispezione Grafo Attiva:</strong></p>
                
                <div class="legenda">
                    <div class="leg-item"><span class="dot" style="background:#4ade80;"></span> Partenza</div>
                    <div class="leg-item"><span class="dot" style="background:#f87171;"></span> Arrivo</div>
                    <div class="leg-item"><span class="dot" style="background:#fbbf24;"></span> Percorso Finale</div>
                    <div class="leg-item"><span class="dot" style="background:#60a5fa;"></span> Esplorati (Closed List)</div>
                    <div class="leg-item"><span class="dot" style="background:#c084fc;"></span> In Coda (Open List)</div>
                </div>

                <div class="info" style="display: none;">
                    Distanza calcolata:<br>
                    <span id="dist-val">-</span> metri
                </div>
            </div>
            <button class="btn" onclick="resetPercorso()">Reset Simulazione</button>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione Mappa (Dark Theme)
        const map = L.map('map', {
            zoomControl: false // Spostiamo i controlli a destra per non coprire
        }).setView([43.7253, 12.6366], 16);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20,
            className: 'blue-map-filter'
        }).addTo(map);

        let graphData = { nodes: {}, edges: [] };
        let adjacencyList = {};
        
        let nodeMarkers = {};
        let edgePolylines = {};
        let searchVisuals = []; // Per tenere traccia dei nodi colorati durante la ricerca e rimuoverli al reset
        
        let startNodeId = null;
        let targetNodeId = null;
        let animationActive = false;

        // Costanti di stile
        const COLOR_DEFAULT = '#475569';
        const COLOR_EDGE = '#1e293b';
        const COLOR_START = '#4ade80';
        const COLOR_TARGET = '#f87171';
        const COLOR_PATH = '#fbbf24';
        const COLOR_OPEN = '#c084fc';
        const COLOR_CLOSED = '#60a5fa';

        // Calcola Distanza di Haversine (in metri)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Raggio della terra in metri
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        // Caricamento Dati
        fetch('mappa_urbino.json')
            .then(res => res.json())
            .then(data => {
                graphData = data;
                buildAdjacencyList();
                renderGraph();
                
                // Maschera per oscurare tutto ciò che è fuori dalle mura
                if (data.mura_polygon) {
                    const worldBounds = [
                        [90, -180],
                        [90, 180],
                        [-90, 180],
                        [-90, -180]
                    ];
                    
                    // Creiamo un poligono con un buco in mezzo (inverted polygon)
                    const mask = L.polygon([worldBounds, data.mura_polygon], {
                        color: '#8b4513', // Marrone per le mura
                        weight: 2,
                        fillColor: '#1e293b', // Blu scuro e desaturato (slate/navy) per la zona esterna
                        fillOpacity: 0.75 // Leggermente più opaco per scurire l'area
                    }).addTo(map);
                    
                    // Imposta i limiti della mappa (aumentato il padding per permettere di scorrere più a destra)
                    const bounds = L.latLngBounds(data.mura_polygon);
                    map.setMaxBounds(bounds.pad(0.8));
                    map.options.minZoom = 15; // Evita di zoomare troppo fuori
                    
                    // Manda la maschera dietro ai nodi/archi ma sopra la mappa base
                    mask.bringToBack();
                }
            });

        function buildAdjacencyList() {
            adjacencyList = {};
            for (let id in graphData.nodes) {
                adjacencyList[id] = [];
            }
            graphData.edges.forEach(edge => {
                if (adjacencyList[edge.from] && adjacencyList[edge.to]) {
                    adjacencyList[edge.from].push({ target: edge.to, cost: edge.distance });
                    // Assumiamo grafo non orientato per le strade pedonali
                    adjacencyList[edge.to].push({ target: edge.from, cost: edge.distance });
                }
            });
        }

        function renderGraph() {
            // Disegna Edifici (solo quelli richiesti in marroncino)
            if (graphData.buildings) {
                // Aggiunta forzata per punti non mappati nativamente
                let hasLavagine = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("porta lavagine"));
                if (!hasLavagine) {
                    graphData.buildings.push({
                        name: "Porta Lavagine",
                        type: "storico",
                        geom_type: "point",
                        geometry: [43.7279627, 12.6377882] // Coordinate esatte dal nodo 667377391
                    });
                }
                
                // Aggiunta Porta Santa Lucia alle coordinate del nodo richiesto
                let hasPslNode = graphData.buildings.some(b => b.name === "Porta Santa Lucia" && Math.abs(b.geometry[0] - 43.729195) < 0.0001);
                if (!hasPslNode) {
                    graphData.buildings.push({
                        name: "Porta Santa Lucia",
                        type: "storico",
                        geom_type: "point",
                        geometry: [43.729195, 12.6360754] // Nodo 11237848125
                    });
                }
                
                let hasMonumento = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("monumento raffaello"));
                if (!hasMonumento) {
                    graphData.buildings.push({
                        name: "Monumento Raffaello",
                        type: "storico",
                        geom_type: "point",
                        geometry: [43.7284578, 12.6334113] // Nodo 5277741372
                    });
                }
                
                // Perimetri poligonali realistici
                let hasOrto = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("orto botanico"));
                if (!hasOrto) {
                    graphData.buildings.push({ 
                        name: "Orto Botanico", type: "storico", geom_type: "polygon", 
                        geometry: [[43.727712, 12.636830], [43.727585, 12.637119], [43.727222, 12.636737], [43.727419, 12.636254], [43.727652, 12.636495]] 
                    });
                }
                let hasParco = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("parco della resistenza"));
                if (!hasParco) {
                    graphData.buildings.push({ 
                        name: "Parco della Resistenza", type: "storico", geom_type: "polygon", 
                        geometry: [[43.7265, 12.6329], [43.7263, 12.6338], [43.7258, 12.6337], [43.7257, 12.6331], [43.7261, 12.6327]] 
                    });
                }
                let hasPiazzale = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("piazzale roma"));
                if (!hasPiazzale) {
                    graphData.buildings.push({ 
                        name: "Piazzale Roma", type: "storico", geom_type: "polygon", 
                        geometry: [[43.7285, 12.6332], [43.7284, 12.6336], [43.7281, 12.6335], [43.7282, 12.6331]] 
                    });
                }
                let hasMercatale = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("borgo mercatale"));
                if (!hasMercatale) {
                    graphData.buildings.push({ 
                        name: "Borgo Mercatale", type: "storico", geom_type: "polygon", 
                        geometry: [[43.7242, 12.6336], [43.7240, 12.6342], [43.7235, 12.6339], [43.7237, 12.6333]] 
                    });
                }
                let hasSanFrancesco = graphData.buildings.some(b => b.name && b.name.toLowerCase().includes("piazza san francesco"));
                if (!hasSanFrancesco) {
                    graphData.buildings.push({ 
                        name: "Piazza San Francesco", type: "storico", geom_type: "polygon", 
                        geometry: [[43.7267, 12.6360], [43.7266, 12.6362], [43.7264, 12.6361], [43.7265, 12.6358]] 
                    });
                }

                const targetNames = [
                    "palazzo ducale", "teatro sanzio", "bar del teatro", 
                    "isia", "fortezza albornoz", "monumento raffaello", 
                    "casa raffaello", "casa natale di raffaello", 
                    "centro commerciale", "duomo", "ghiottone", 
                    "cinema ducale", "lavagine", "valbona", "porta santa lucia",
                    "monastero di santa chiara"
                ];
                
                const greenTargetNames = [
                    "orto botanico", "parco della resistenza", "piazzale roma"
                ];
                
                const blueTargetNames = [
                    "repubblica", "borgo mercatale", "piazza san francesco", "piazza della repubblica"
                ];
                
                // Ordiniamo in modo che le aree verdi vengano disegnate PRIMA, 
                // poi le piazze azzurre, e infine gli edifici marroni in primo piano
                graphData.buildings.sort((a, b) => {
                    let aName = (a.name || "").toLowerCase();
                    let bName = (b.name || "").toLowerCase();
                    // Palazzo Giusti diventa Cinema Ducale anche nell'ordinamento
                    if (a.name === "Palazzo Giusti") aName = "cinema ducale";
                    if (b.name === "Palazzo Giusti") bName = "cinema ducale";
                    
                    let aIsGreen = greenTargetNames.some(t => aName.includes(t));
                    let bIsGreen = greenTargetNames.some(t => bName.includes(t));
                    let aIsBlue = blueTargetNames.some(t => aName.includes(t));
                    let bIsBlue = blueTargetNames.some(t => bName.includes(t));
                    
                    let aScore = aIsGreen ? 0 : (aIsBlue ? 1 : 2);
                    let bScore = bIsGreen ? 0 : (bIsBlue ? 1 : 2);
                    
                    return aScore - bScore;
                });
                
                graphData.buildings.forEach(b => {
                    if (!b.name) return;
                    
                    // Evita di evidenziare la vecchia Porta Santa Lucia errata (solo quella nuova)
                    if (b.name === "Porta Santa Lucia" && Math.abs(b.geometry[0] - 43.729195) > 0.0001) {
                        return;
                    }
                    
                    // Ingrandisce il poligono originale di Piazza della Repubblica
                    if (b.name === "Repubblica" && b.geom_type === "polygon") {
                        let cLat = 0, cLng = 0;
                        b.geometry.forEach(p => { cLat += p[0]; cLng += p[1]; });
                        cLat /= b.geometry.length;
                        cLng /= b.geometry.length;
                        let scale = 5.0; // Ingrandiamo in modo molto più marcato
                        b.geometry = b.geometry.map(p => [
                            cLat + (p[0] - cLat) * scale,
                            cLng + (p[1] - cLng) * scale
                        ]);
                        b.name = "Piazza della Repubblica";
                    }
                    
                    // L'edificio al civico richiesto è accatastato come Palazzo Giusti
                    if (b.name === "Palazzo Giusti") {
                        b.name = "Cinema Ducale";
                    }
                    
                    let bName = b.name.toLowerCase();
                    let isTarget = targetNames.some(t => bName.includes(t));
                    let isGreenTarget = greenTargetNames.some(t => bName.includes(t));
                    let isBlueTarget = blueTargetNames.some(t => bName.includes(t));
                    
                    if (isTarget || isGreenTarget || isBlueTarget) {
                        let strokeColor = isGreenTarget ? '#15803d' : (isBlueTarget ? '#0284c7' : '#b45309');
                        let fillColor = isGreenTarget ? '#22c55e' : (isBlueTarget ? '#38bdf8' : '#d97706');
                        
                        let targetOpacity = (isGreenTarget || isBlueTarget) ? 0.4 : 1.0;
                        
                        // Per far sì che le tooltip degli edifici stiano sopra, possiamo forzare il bringToFront
                        let layer;
                        if (b.geom_type === "polygon") {
                            layer = L.polygon(b.geometry, {
                                color: strokeColor,
                                weight: 2,
                                fillColor: fillColor,
                                fillOpacity: targetOpacity
                            }).bindTooltip(b.name).addTo(map);
                        } else if (b.geom_type === "point") {
                            // Se è una delle due porte richieste, la disegniamo quadrata
                            if (b.name === "Porta Lavagine" || b.name === "Porta Santa Lucia") {
                                let offsetLat = 0.00008; // circa 8-10 metri
                                let offsetLng = 0.00010;
                                let bounds = [
                                    [b.geometry[0] - offsetLat, b.geometry[1] - offsetLng],
                                    [b.geometry[0] + offsetLat, b.geometry[1] + offsetLng]
                                ];
                                layer = L.rectangle(bounds, {
                                    color: strokeColor,
                                    weight: 2,
                                    fillColor: fillColor,
                                    fillOpacity: targetOpacity
                                }).bindTooltip(b.name).addTo(map);
                            } else {
                                layer = L.circleMarker(b.geometry, {
                                    radius: 8,
                                    color: strokeColor,
                                    weight: 2,
                                    fillColor: fillColor,
                                    fillOpacity: targetOpacity
                                }).bindTooltip(b.name).addTo(map);
                            }
                        }
                        
                        // Sicurezza aggiuntiva per i layer SVG
                        if (layer && isTarget && !isGreenTarget && !isBlueTarget) {
                            layer.bringToFront();
                        }
                    }
                });
            }

            // Disegna Archi
            graphData.edges.forEach(edge => {
                const p1 = graphData.nodes[edge.from];
                const p2 = graphData.nodes[edge.to];
                if (p1 && p2) {
                    const line = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], {
                        color: COLOR_EDGE,
                        weight: 2,
                        opacity: 0.6,
                        interactive: false
                    }).addTo(map);
                    edgePolylines[`${edge.from}-${edge.to}`] = line;
                    edgePolylines[`${edge.to}-${edge.from}`] = line;
                }
            });

            // Disegna Nodi
            for (let id in graphData.nodes) {
                const node = graphData.nodes[id];
                const circle = L.circleMarker([node.lat, node.lng], {
                    radius: 4,
                    fillColor: COLOR_DEFAULT,
                    color: '#000',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);

                circle.on('click', () => onNodeClick(id));
                circle.bindTooltip(`Nodo: ${id}`, {direction: 'top'});
                nodeMarkers[id] = circle;
            }
        }

        function onNodeClick(id) {
            if (animationActive) return;

            if (!startNodeId) {
                startNodeId = id;
                nodeMarkers[id].setStyle({ fillColor: COLOR_START, radius: 6 });
            } else if (!targetNodeId && id !== startNodeId) {
                targetNodeId = id;
                nodeMarkers[id].setStyle({ fillColor: COLOR_TARGET, radius: 6 });
                runAStar(startNodeId, targetNodeId);
            }
        }

        function resetPercorso() {
            animationActive = false;
            startNodeId = null;
            targetNodeId = null;
            document.getElementById('dist-val').innerText = '-';

            // Ripristina stili Nodi
            for (let id in nodeMarkers) {
                nodeMarkers[id].setStyle({ fillColor: COLOR_DEFAULT, radius: 4 });
            }
            
            // Ripristina stili Archi
            for (let key in edgePolylines) {
                edgePolylines[key].setStyle({ color: COLOR_EDGE, weight: 2, opacity: 0.6 });
            }
            
            // Rimuove visualizzazioni temporanee
            searchVisuals.forEach(v => map.removeLayer(v));
            searchVisuals = [];
        }

        // Funzione asincrona per animare la ricerca
        async function runAStar(start, target) {
            animationActive = true;
            
            let openSet = [start];
            let cameFrom = {};
            
            let gScore = {};
            let fScore = {};
            
            for (let id in graphData.nodes) {
                gScore[id] = Infinity;
                fScore[id] = Infinity;
            }
            
            gScore[start] = 0;
            const targetNode = graphData.nodes[target];
            fScore[start] = calcDistance(graphData.nodes[start].lat, graphData.nodes[start].lng, targetNode.lat, targetNode.lng);
            
            let currentPathLines = {}; // Mantiene i riferimenti agli archi disegnati durante la ricerca
            
            while (openSet.length > 0) {
                if (!animationActive) return; // Interrotta dal reset

                // Trova nodo con fScore minimo
                let minIndex = 0;
                for (let i = 1; i < openSet.length; i++) {
                    if (fScore[openSet[i]] < fScore[openSet[minIndex]]) {
                        minIndex = i;
                    }
                }
                
                let current = openSet[minIndex];
                
                if (current === target) {
                    await reconstructPath(cameFrom, current);
                    animationActive = false;
                    return;
                }
                
                openSet.splice(minIndex, 1);
                
                // Colora il nodo esplorato (Closed)
                if (current !== start) {
                    nodeMarkers[current].setStyle({ fillColor: COLOR_CLOSED });
                }

                // Esplora vicini
                for (let neighbor of adjacencyList[current]) {
                    let tentative_gScore = gScore[current] + neighbor.cost;
                    
                    if (tentative_gScore < gScore[neighbor.target]) {
                        cameFrom[neighbor.target] = current;
                        gScore[neighbor.target] = tentative_gScore;
                        
                        let nNode = graphData.nodes[neighbor.target];
                        fScore[neighbor.target] = tentative_gScore + calcDistance(nNode.lat, nNode.lng, targetNode.lat, targetNode.lng);
                        
                        if (!openSet.includes(neighbor.target)) {
                            openSet.push(neighbor.target);
                            if (neighbor.target !== target) {
                                nodeMarkers[neighbor.target].setStyle({ fillColor: COLOR_OPEN });
                            }
                        }
                    }
                }

                // Attendi un attimo per l'animazione
                await new Promise(r => setTimeout(r, 10)); // 10ms delay per step
            }
            
            // Se finisce il while senza trovare il target
            alert("Percorso non trovato!");
            animationActive = false;
        }

        async function reconstructPath(cameFrom, current) {
            let totalPath = [current];
            let totalCost = 0;
            
            while (cameFrom[current]) {
                const prev = cameFrom[current];
                // Trova costo dell'arco
                const edgeCost = adjacencyList[prev].find(e => e.target === current).cost;
                totalCost += edgeCost;
                
                current = prev;
                totalPath.unshift(current);
            }
            
            document.getElementById('dist-val').innerText = totalCost.toFixed(2);
            
            // Anima il disegno del percorso finale
            for (let i = 0; i < totalPath.length - 1; i++) {
                if (!animationActive) return; // se resettato

                const p1 = graphData.nodes[totalPath[i]];
                const p2 = graphData.nodes[totalPath[i+1]];
                
                const pathLine = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], {
                    color: COLOR_PATH,
                    weight: 5,
                    opacity: 1
                }).addTo(map);
                
                searchVisuals.push(pathLine);
                
                // Evidenzia nodi del percorso
                if (totalPath[i] !== startNodeId && totalPath[i] !== targetNodeId) {
                    nodeMarkers[totalPath[i]].setStyle({ fillColor: COLOR_PATH, radius: 5 });
                }
                
                await new Promise(r => setTimeout(r, 30)); // Delay per l'animazione finale
            }
        }
    </script>
</body>
</html>
